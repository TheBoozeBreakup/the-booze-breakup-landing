<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're In | The Booze Breakup</title>
  <style>
    :root {
      --cream: #f4efe6;
      --ink: #171615;
      --wine: #8f1820;
      --muted: #665f57;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      padding: 32px 22px;
    }
    .success {
      width: min(760px, 100%);
      text-align: center;
    }
    .eyebrow {
      color: var(--wine);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 500;
      font-size: clamp(2.15rem, 5vw, 3.7rem);
      line-height: 1;
      letter-spacing: -0.055em;
      margin-bottom: 30px;
    }
    .rule {
      width: 74px;
      height: 4px;
      background: var(--wine);
      margin: 30px auto;
    }
    h2 {
      margin: 0 auto 20px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.6rem, 4vw, 2.35rem);
      font-weight: 500;
    }
    p {
      max-width: 760px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      white-space: nowrap;
    }
    a {
      display: inline-block;
      margin-top: 34px;
      padding: 14px 24px;
      background: var(--wine);
      color: #fff;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: none;
      border-radius: 3px;
    }
    a:hover { opacity: 0.9; }
    @media (max-width: 760px) {
      p { white-space: normal; }
    }
  </style>
</head>
<body>
  <main class="success">
    <div class="eyebrow">THE BOOZE BREAKUP</div>
    <h1>Cheers, You’re In!</h1>
    <h2>Welcome to the Relationship.</h2>
    <p>You’ll receive occasional updates on <em>The Booze Breakup</em>, release news, community updates, and more.</p>
    <a href="https://www.theboozebreakup.com/">Back to The Booze Breakup</a>
  </main>
</body>
</html>
